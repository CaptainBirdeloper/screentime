<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ScreenTime</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <!-- Range Selector Tabs -->
    <div class="tabs-bar">
      <div class="tabs">
        <button class="tab-btn active" data-range="today">Today</button>
        <button class="tab-btn" data-range="yesterday">Yesterday</button>
        <button class="tab-btn" data-range="7days">Last 7 Days</button>
      </div>
    </div>

    <!-- Core Metrics -->
    <section class="metrics-grid">
      <div class="metric-card">
        <div class="metric-title">Total Screen Time</div>
        <div class="metric-value primary-highlight" id="totalTimeVal">0h 0m 0s</div>
      </div>
      <div class="metric-card">
        <div class="metric-title">Top Application</div>
        <div class="metric-value" id="topAppVal">—</div>
        <div class="metric-sub" id="topAppSub">0% of total</div>
      </div>
    </section>

    <!-- Main Grid -->
    <main class="dashboard-grid">
      <!-- Usage Distribution Chart -->
      <div class="panel chart-panel">
        <div class="panel-header">
          <h2>Distribution</h2>
        </div>
        <div class="chart-wrapper">
          <div class="svg-chart-box">
            <svg id="donutSvg" viewBox="0 0 200 200" class="donut-svg">
              <circle cx="100" cy="100" r="70" class="donut-bg" />
              <g id="donutSegments"></g>
            </svg>
          </div>
          <div class="chart-legend" id="chartLegend"></div>
        </div>
      </div>

      <!-- Application Breakdown List -->
      <div class="panel apps-panel">
        <div class="panel-header">
          <h2>Applications</h2>
          <span class="panel-tag" id="appCountTag">0 Apps</span>
        </div>
        <div class="apps-list-scroll" id="appsList">
          <div class="empty-state">No screen time recorded for this period yet.</div>
        </div>
      </div>
    </main>

    <!-- Hourly Timeline -->
    <section class="panel timeline-panel" id="timelineSection">
      <div class="panel-header">
        <h2>24-Hour Timeline</h2>
      </div>
      <div class="timeline-bars-container" id="timelineContainer"></div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
