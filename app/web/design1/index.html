<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ScreenTime • AMOLED Bento</title>
  <!-- Modular Bento Feature Stylesheets -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/charts.css">
  <link rel="stylesheet" href="css/timeline.css">
</head>
<body>
  <div class="bento-app">
    <!-- Top Floating Segmented Dock -->
    <div class="bento-nav-dock">
      <div class="pill-group">
        <button class="pill-btn active" data-range="today">Today</button>
        <button class="pill-btn" data-range="yesterday">Yesterday</button>
        <button class="pill-btn" data-range="7days">Last 7 Days</button>
      </div>
      <span class="dock-badge" id="appCountTag">0 Apps Active</span>
    </div>

    <!-- Main Bento Grid -->
    <main class="bento-main-grid">
      <!-- 1. Hero Focus Bento (2 Columns) -->
      <div class="bento-card hero-focus-bento">
        <div class="hero-main-content">
          <div class="bento-title-label">Active Screen Time</div>
          <div class="hero-big-timer" id="totalTimeVal">0h 0m 0s</div>
        </div>

        <div class="hero-top-app-strip">
          <div class="top-app-left">
            <span class="top-app-dot"></span>
            <span class="top-app-name-text" id="topAppVal">—</span>
          </div>
          <span class="top-app-pill-stat" id="topAppSub">0%</span>
        </div>
      </div>

      <!-- 2. Multi-Segment Distribution Bento (1 Column) -->
      <div class="bento-card distribution-bento">
        <div class="bento-header">
          <span class="bento-title-label">Distribution</span>
        </div>
        <div class="horizon-meter-bar" id="horizonMeter"></div>
        <div class="meter-legend-list" id="chartLegend"></div>
      </div>

      <!-- 3. Applications Grid Bento (3 Columns) -->
      <div class="bento-card apps-grid-bento">
        <div class="bento-header">
          <span class="bento-title-label">Application Grid</span>
        </div>
        <div class="apps-tiles-container" id="appsList">
          <div class="empty-tile-notice">No screen time logged for this time window.</div>
        </div>
      </div>

      <!-- 4. 24-Hour Spectrum Heatmap Bento (3 Columns) -->
      <div class="bento-card timeline-bento" id="timelineSection">
        <div class="bento-header">
          <span class="bento-title-label">24-Hour Activity Spectrum</span>
        </div>
        <div class="timeline-heat-matrix" id="timelineContainer"></div>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
