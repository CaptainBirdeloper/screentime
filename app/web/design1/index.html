<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ScreenTime • Prototype Exploration</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/variant1.css">
  <link rel="stylesheet" href="css/variant2.css">
  <link rel="stylesheet" href="css/variant3.css">
</head>
<body>
  <!-- Active Prototype Canvas Stage -->
  <main id="stage" role="main"></main>

  <!-- Prototype Picker Harness (verbatim from PICKER.md) -->
  <nav class="proto-picker" aria-label="Prototype variants">
    <span class="proto-picker-highlight" aria-hidden="true"></span>
    <button class="proto-picker-item" data-active aria-current="true">Chunky Neo</button>
    <button class="proto-picker-item">Solid Bento</button>
    <button class="proto-picker-item">Waveform Studio</button>
    <span class="proto-picker-divider" aria-hidden="true"></span>
    <button class="proto-picker-item proto-picker-replay" aria-label="Replay animation (R)">↻</button>
  </nav>

  <script src="app.js"></script>
</body>
</html>
